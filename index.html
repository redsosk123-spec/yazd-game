<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>پیست یزدتایر | لیگ کارکنان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://tapi.bale.ai/miniapp.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Vazirmatn, Tahoma}
body{margin:0;background:#0e1420;color:#fff}
#app{max-width:440px;margin:auto;padding:10px}
header{text-align:center;padding:8px}
header img{width:150px;background:#fff;border-radius:12px;padding:6px}
.card{background:#182233;border-radius:16px;padding:12px;margin:10px 0}
input,select{width:100%;padding:10px;border-radius:10px;border:0;margin:6px 0;color:#111}
button{border:0;border-radius:12px;padding:12px;width:100%;font-size:16px;background:#f5731a;color:#fff;margin-top:8px}
.row{display:flex;gap:8px}
#slideImg{width:100%;border-radius:12px;height:170px;object-fit:cover;background:#000}
#league table{width:100%;font-size:14px;border-collapse:collapse}
#league td,#league th{padding:6px;border-bottom:1px solid #2a3a55;text-align:right}
tr.me{background:#f5731a33}
#game-screen{padding-bottom:20px}
#hud-top{display:flex;gap:8px;align-items:center;background:#182233;border-radius:12px;padding:8px;margin:8px 0}
#hud-top div{flex:1;text-align:center;background:#0e1420;border-radius:8px;padding:6px;font-size:13px}
#musicBtnInGame{width:48px;flex:none;font-size:20px;background:#0e1420;padding:6px}
#time-bar-wrap{background:#000;border-radius:99px;height:8px;overflow:hidden;margin:4px 0}
#time-bar{height:100%;width:100%;background:#22c55e}
#tags{display:flex;justify-content:space-between;font-size:13px;min-height:20px}
#three-container{width:100%;max-width:420px;height:480px;margin:auto;position:relative;overflow:hidden;border-radius:16px;background:#000}
#comboPop{position:absolute;top:40%;width:100%;text-align:center;font-size:28px;font-weight:800;pointer-events:none;opacity:0;transition:.3s}
.float-plus{position:absolute;color:#ffe600;font-weight:800;animation:up 0.8s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#controls{display:flex;gap:12px;margin:10px 0}
#controls button{width:64px;height:64px;font-size:28px;margin:auto;flex:none;border-radius:50%}
#result{display:none;text-align:center}
</style>
</head>
<body>
<div id="app">
<header>
<img src="https://yric.com/wp-content/uploads/2025/09/yazd-tire-logo-site-01-copy.svg">
<h3 style="margin:6px">پیست یزدتایر | لیگ کارکنان</h3>
</header>
<div id="home">
<div class="card">
<label>نام و نام خانوادگی<input id="inName" placeholder="مثلاً علی رضایی"></label>
<label>واحد<select id="inUnit">
<option>تکنیکال</option>
<option>کنترل کیفیت</option>
<option>فنی</option>
<option>اداری</option>
<option selected>تولید</option>
<option>انبار</option>
<option>برنامه‌ریزی</option>
</select></label>
<button onclick="startGame()">شروع مسابقه 🏁</button>
<div class="row">
<button id="musicBtn" onclick="toggleMusic(event)">🔊 موسیقی</button>
<button id="voiceBtn" onclick="toggleVoice()">🎙 گفتار: روشن</button>
</div>
</div>
<div class="card"><img id="slideImg" src="slide1.jpg"></div>
<div class="card" id="result"></div>
<div class="card"><h4 style="margin:4px">جدول لیگ</h4><div id="league"></div></div>
</div>
<div id="game-screen" style="display:none">
<div id="hud-top">
<div>امتیاز<br><b id="oScore">0</b></div>
<div>سکه<br><b id="oCoin">0</b></div>
<div>زمان<br><b id="oTime">60</b></div>
<button id="musicBtnInGame" onclick="toggleMusic(event)">🔊</button>
</div>
<div id="time-bar-wrap"><div id="time-bar"></div></div>
<div id="tags"><span id="comboTag"></span><span id="speedTag"></span></div>
<div id="three-container"><div id="comboPop"></div></div>
<div id="controls">
<button onclick="move(-1)">◀</button>
<button onclick="move(1)">▶</button>
</div>
<button onclick="endGame()" style="background:#334155">پایان مسابقه</button>
</div>
</div>
<audio id="bgm" src="music.mp3" loop></audio>
<script>
var LANES=[-3.1,0,3.1];
var units=[
{n:'تکنیکال',c:'#1e5fe0',shirt:'#1e5fe0',second:'#ffffff',p:13250},
{n:'کنترل کیفیت',c:'#178040',shirt:'#178040',second:'#d6cfa3',p:12980},
{n:'فنی',c:'#1e3260',shirt:'#1e3260',second:'#ffffff',p:12760},
{n:'اداری',c:'#4fb4e8',shirt:'#4fb4e8',second:'#ffffff',p:12470},
{n:'تولید',c:'#f5731a',shirt:'#1e3260',second:'#f5731a',p:12190},
{n:'انبار',c:'#6b4423',shirt:'#6b4423',second:'#ffffff',p:11870},
{n:'برنامه‌ریزی',c:'#eab308',shirt:'#151515',second:'#eab308',p:11620}
];
var me=null; try{me=JSON.parse(localStorage.getItem('yazd_me')||'null')}catch(e){}
var musicOn=true, voiceOn=true;
var faWords=['آفرین','عالی','باریکلا','ادامه بده','تو می‌تونی','سرعتت عالیه'];
var laneIndex=1,targetX=0;
var scene=null,camera=null,renderer=null,car=null;
var carBodyMat=null,driverShirtMat=null,driverSecondMat=null;
var wheels=[],coins=[],obstacles=[],dashes=[];
var running=false,score=0,coinCount=0,timeLeft=60,combo=0,lastTime=0,threeInit=false;
function M(c){return new THREE.MeshPhongMaterial({color:c,shininess:60});}
function normalizeUnitName(u){
u=(u||'').toString().trim().replace(/ي/g,'ی').replace(/ك/g,'ک');
if(u.indexOf('کنترل')>=0)return 'کنترل کیفیت';
if(u.indexOf('برنامه')>=0)return 'برنامه‌ریزی';
if(u.indexOf('تکنی')>=0)return 'تکنیکال';
if(u.indexOf('تول')>=0)return 'تولید';
if(u.indexOf('انبار')>=0)return 'انبار';
if(u.indexOf('ادار')>=0)return 'اداری';
if(u.indexOf('فن')>=0)return 'فنی';
for(var i=0;i<units.length;i++)if(units[i].n===u)return u;
return 'تولید';
}
function getDriverColors(){
var uv=normalizeUnitName((me&&me.unit)||document.getElementById('inUnit').value);
for(var i=0;i<units.length;i++)if(units[i].n===uv)return{shirt:units[i].shirt,second:units[i].second};
return{shirt:'#1e3260',second:'#f5731a'};
}
function getUnitMainColor(){
var uv=normalizeUnitName((me&&me.unit)||document.getElementById('inUnit').value);
for(var i=0;i<units.length;i++)if(units[i].n===uv)return units[i].c;
return '#f5731a';
}
function updateDriverColor(){
var cc=getDriverColors();
if(driverShirtMat)driverShirtMat.color.set(cc.shirt);
if(driverSecondMat)driverSecondMat.color.set(cc.second);
}
function updateCarColor(){if(carBodyMat)carBodyMat.color.set(getUnitMainColor());}
function makeLogoTexture(){
var cv=document.createElement('canvas');cv.width=cv.height=256;
var g=cv.getContext('2d');
g.fillStyle='#111';g.fillRect(0,0,256,256);
g.beginPath();g.arc(128,128,110,0,7);g.fillStyle='#0a0a0a';g.fill();
g.lineWidth=18;g.strokeStyle='#333';g.stroke();
g.lineWidth=10;g.strokeStyle='#f5731a';g.beginPath();g.arc(128,128,88,0,7);g.stroke();
g.fillStyle='#fff';g.font='bold 34px Tahoma';g.textAlign='center';
g.fillText('YAZD',128,120);g.fillText('TIRE',128,160);
return new THREE.CanvasTexture(cv);
}
var logoTex=null;
function getGameSize(){var c=document.getElementById('three-container');return{w:(c.clientWidth||360),h:480};}
function updateThreeSize(){if(!renderer||!camera)return;var s=getGameSize();renderer.setSize(s.w,s.h);camera.aspect=s.w/s.h;camera.updateProjectionMatrix();}
function ensureThree(){
if(threeInit)return true;
if(typeof THREE==='undefined'){document.getElementById('three-container').innerHTML='خطا در لود Three.js - اینترنت را بررسی کن';return false;}
logoTex=makeLogoTexture();
scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1420);scene.fog=new THREE.Fog(0x0e1420,20,80);
var s=getGameSize();
camera=new THREE.PerspectiveCamera(70,s.w/s.h,0.1,200);
camera.position.set(0,5.2,7.5);camera.lookAt(0,0.5,-6);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(s.w,s.h);
document.getElementById('three-container').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x223344,0.95));
var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(5,10,5);scene.add(dl);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,140),new THREE.MeshLambertMaterial({color:0x14301c}));
ground.rotation.x=-Math.PI/2;ground.position.z=-40;scene.add(ground);
var road=new THREE.Mesh(new THREE.PlaneGeometry(9.5,140),new THREE.MeshLambertMaterial({color:0x2b2f36}));
road.rotation.x=-Math.PI/2;road.position.z=-40;scene.add(road);
for(var i=0;i<16;i++){
for(var k=0;k<2;k++){
var d=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.02,1.4),new THREE.MeshBasicMaterial({color:0xffffff}));
d.position.set(k===0?-1.55:1.55,0.02,-70+i*9);scene.add(d);dashes.push(d);
}}
car=buildLambo();car.position.set(0,0,2);scene.add(car);
for(var ci=0;ci<7;ci++){var cg=buildCoin();scene.add(cg);coins.push(cg);}
for(var oi=0;oi<5;oi++){var ob=buildObstacle();scene.add(ob);obstacles.push(ob);}
resetPositions();
threeInit=true;updateThreeSize();return true;
}
function buildLambo(){
var g=new THREE.Group();
carBodyMat=M(0xf5731a);var yellow=carBodyMat;
var body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.6,4.2),yellow);body.position.y=0.7;g.add(body);
var nose=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.4,1),yellow);nose.position.set(0,0.5,-2.4);g.add(nose);
driverShirtMat=M(0x1e3260);driverSecondMat=M(0xf5731a);
var seatD=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.4),M(0x111111));seatD.position.set(0,1,0.7);g.add(seatD);
var torso=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.4),driverShirtMat);torso.position.set(0,1.25,0.2);g.add(torso);
var belt=new THREE.Mesh(new THREE.BoxGeometry(0.64,0.12,0.42),M(0x000000));belt.position.set(0,1.25,0.2);g.add(belt);
var shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.18,0.42),driverSecondMat);shoulder.position.set(0,1.5,0.2);g.add(shoulder);
var armL=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.7,10),driverShirtMat);armL.position.set(-0.35,1.2,-0.3);armL.rotation.x=1.1;g.add(armL);
var armR=armL.clone();armR.position.x=0.35;g.add(armR);
var swheel=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.06,10,20),M(0x111111));swheel.position.set(0,1.15,-0.45);g.add(swheel);
var head=new THREE.Mesh(new THREE.SphereGeometry(0.26,16,16),M(0xffcc99));head.position.set(0,1.85,0.25);g.add(head);
var helmet=new THREE.Mesh(new THREE.SphereGeometry(0.31,16,16,0,Math.PI*2,0,Math.PI/1.7),driverShirtMat);helmet.position.set(0,1.9,0.25);g.add(helmet);
var visor=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.14,0.1),new THREE.MeshPhongMaterial({color:0x000000}));visor.position.set(0,1.86,-0.02);g.add(visor);
var cabin=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.62,1.9),new THREE.MeshPhongMaterial({color:0x99d4ff,transparent:true,opacity:0.55,shininess:100}));
cabin.position.set(0,1.3,-0.1);g.add(cabin);
var wg=new THREE.CylinderGeometry(0.42,0.42,0.35,16);wg.rotateZ(Math.PI/2);
var wm=M(0x111111);
[[-1.1,0.4,1.4],[1.1,0.4,1.4],[-1.1,0.4,-1.4],[1.1,0.4,-1.4]].forEach(function(p){
var w=new THREE.Mesh(wg,wm);w.position.set(p[0],p[1],p[2]);g.add(w);wheels.push(w);});
var sp=new THREE.Mesh(new THREE.BoxGeometry(2,0.12,0.5),M(0x111111));sp.position.set(0,1.15,2);g.add(sp);
return g;
}
function buildCoin(){
var gr=new THREE.Group();
var cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.18,24),new THREE.MeshPhongMaterial({color:0xffc400,shininess:90}));
cyl.rotation.x=Math.PI/2;gr.add(cyl);
var pm=new THREE.MeshBasicMaterial({map:logoTex,transparent:true});
var f=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.9),pm);f.position.z=0.1;gr.add(f);
var b=f.clone();b.rotation.y=Math.PI;b.position.z=-0.1;gr.add(b);
gr.position.set(LANES[Math.floor(Math.random()*3)],0.8,-20-Math.random()*50);
return gr;
}
function buildObstacle(){
var gr=new THREE.Group();
var base=new THREE.Mesh(new THREE.BoxGeometry(1,0.2,1),M(0x111111));base.position.y=0.1;gr.add(base);
var cone=new THREE.Mesh(new THREE.ConeGeometry(0.62,1.4,16),M(0xff5a00));cone.position.y=1;gr.add(cone);
var band=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.48,0.32,16),M(0xffffff));band.position.y=0.85;gr.add(band);
gr.position.set(LANES[Math.floor(Math.random()*3)],0,-15-Math.random()*55);
return gr;
}
function resetPositions(){
coins.forEach(function(c,i){c.position.set(LANES[Math.floor(Math.random()*3)],0.8,-12-i*11-Math.random()*5);c.visible=true;});
obstacles.forEach(function(o,i){o.position.set(LANES[Math.floor(Math.random()*3)],0,-25-i*14-Math.random()*6);o.visible=true;});
}
function move(d){
laneIndex=Math.max(0,Math.min(2,laneIndex+d));targetX=LANES[laneIndex];
try{if(navigator.vibrate)navigator.vibrate(10)}catch(e){}
}
function toggleMusic(e){
if(e&&e.stopPropagation)e.stopPropagation();
if(e&&e.preventDefault)e.preventDefault();
musicOn=!musicOn;
var a=document.getElementById('bgm');
try{if(musicOn){a.play().catch(function(){});}else{a.pause();}}catch(err){}
var t=musicOn?'🔊':'🔇';
document.getElementById('musicBtn').textContent=t+' موسیقی';
document.getElementById('musicBtnInGame').textContent=t;
}
function toggleVoice(){voiceOn=!voiceOn;document.getElementById('voiceBtn').textContent=voiceOn?'🎙 گفتار: روشن':'🎙 گفتار: خاموش';}
function speakCoin(){
if(!voiceOn)return;
if(coinCount%10!==0)return;
try{
var u=new SpeechSynthesisUtterance(faWords[Math.floor(Math.random()*faWords.length)]);
u.lang='fa-IR';speechSynthesis.speak(u);
}catch(e){}
}
function syncHUD(){
document.getElementById('oScore').textContent=Math.floor(score);
document.getElementById('oCoin').textContent=coinCount;
document.getElementById('oTime').textContent=Math.ceil(timeLeft);
document.getElementById('time-bar').style.width=(timeLeft/60*100)+'%';
document.getElementById('comboTag').textContent=combo>=2?('کمبو ×'+combo):'';
var sp=Math.round(120+(60-timeLeft)*1.5+coinCount*2);
document.getElementById('speedTag').textContent=sp+' km/h';
}
function pop(txt){
var el=document.getElementById('comboPop');el.textContent=txt;el.style.opacity=1;
setTimeout(function(){el.style.opacity=0},600);
}
function floatPlus(txt){
var c=document.getElementById('three-container');
var d=document.createElement('div');d.className='float-plus';d.textContent=txt;
d.style.left='45%';d.style.top='55%';c.appendChild(d);
setTimeout(function(){d.remove()},800);
}
function startGame(){
var nm=document.getElementById('inUnit').value;
var nn=document.getElementById('inName').value||'کارمند یزدتایر';
me={name:nn,unit:normalizeUnitName(nm),best:(me&&me.best)||0};
try{localStorage.setItem('yazd_me',JSON.stringify(me))}catch(e){}
if(!ensureThree())return;
updateDriverColor();updateCarColor();
document.getElementById('home').style.display='none';
document.getElementById('game-screen').style.display='block';
updateThreeSize();
laneIndex=1;targetX=0;score=0;coinCount=0;timeLeft=60;combo=0;
resetPositions();
if(car)car.position.x=0;
running=true;lastTime=performance.now();
if(musicOn){var a=document.getElementById('bgm');try{a.currentTime=0;a.play().catch(function(){});}catch(e){}}
requestAnimationFrame(loop);
}
function loop(now){
if(!running)return;
var dt=(now-lastTime)/1000;lastTime=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
var speed=14+(60-timeLeft)*0.18+coinCount*0.06;
car.position.x+=(targetX-car.position.x)*Math.min(1,dt*10);
wheels.forEach(function(w){w.rotation.x+=speed*dt*2.2;});
dashes.forEach(function(d){d.position.z+=speed*dt;if(d.position.z>9)d.position.z=-75;});
coins.forEach(function(c){
c.rotation.y+=dt*3;c.position.z+=speed*dt;
if(c.position.z>9){c.position.z=-70-Math.random()*10;c.position.x=LANES[Math.floor(Math.random()*3)];}
if(Math.abs(c.position.z-2)<1.2&&Math.abs(c.position.x-car.position.x)<1.2){
c.position.z=-70-Math.random()*10;c.position.x=LANES[Math.floor(Math.random()*3)];
score+=100+combo*10;coinCount++;combo++;
floatPlus('+'+(100+(combo-1)*10));if(combo>=3)pop('کمبو ×'+combo);
speakCoin();try{if(navigator.vibrate)navigator.vibrate(20)}catch(e){}
}});
obstacles.forEach(function(o){
o.position.z+=speed*dt;
if(o.position.z>9){o.position.z=-75-Math.random()*10;o.position.x=LANES[Math.floor(Math.random()*3)];}
if(Math.abs(o.position.z-2)<1.3&&Math.abs(o.position.x-car.position.x)<1.2){
o.position.z=-75-Math.random()*10;o.position.x=LANES[Math.floor(Math.random()*3)];
score=Math.max(0,score-200);combo=0;pop('💥');
try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}
}});
timeLeft-=dt;syncHUD();
if(timeLeft<=0){endGame();return;}
requestAnimationFrame(loop);
}
function endGame(){
if(running)running=false;
var fs=Math.floor(score);
if(me){if(fs>((me&&me.best)||0))me.best=fs;try{localStorage.setItem('yazd_me',JSON.stringify(me))}catch(e){}}
document.getElementById('game-screen').style.display='none';
document.getElementById('home').style.display='block';
var r=document.getElementById('result');r.style.display='block';
r.innerHTML='🏁 مسابقه تمام شد!<br>امتیاز: <b>'+fs+'</b> | سکه: <b>'+coinCount+'</b> | واحد: <b>'+(me?me.unit:'')+'</b>';
renderLeague();
window.scrollTo(0,0);
}
function renderLeague(){
var arr=units.slice().sort(function(a,b){return b.p-a.p;});
var h='<table><tr><th>واحد</th><th>امتیاز</th></tr>';
arr.forEach(function(u){
var cls=(me&&normalizeUnitName(me.unit)===u.n)?' class="me"':'';
var sc=u.p+(((me&&normalizeUnitName(me.unit)===u.n)&&(me.best||0)>0)?'<br><small>+'+me.best+' شما</small>':'');
h+='<tr'+cls+'><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+u.c+'"></span> '+u.n+'</td><td>'+sc+'</td></tr>';
});
h+='</table>';document.getElementById('league').innerHTML=h;
}
window.addEventListener('resize',updateThreeSize);
document.addEventListener('visibilitychange',function(){
var a=document.getElementById('bgm');
if(document.hidden){try{a.pause()}catch(e){}}
else{if(musicOn&&running){try{a.play().catch(function(){})}catch(e){}}}
});
window.addEventListener('keydown',function(e){if(document.getElementById('game-screen').style.display==='none')return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
(function(){
if(me){document.getElementById('inName').value=me.name||'';document.getElementById('inUnit').value=me.unit||'تولید';}
renderLeague();
var si=1;setInterval(function(){si++;if(si>30)si=1;var im=document.getElementById('slideImg');im.src='slide'+si+'.jpg';},3000);
var tc=null,sx=0;
var c=document.getElementById('three-container');
c.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
c.addEventListener('touchend',function(e){
var dx=e.changedTouches[0].clientX-sx;
if(Math.abs(dx)>30)move(dx>0?1:-1);
},{passive:true});
})();
</script>
</body>
</html>
